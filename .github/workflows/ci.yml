name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      # Includes the determinism, replay, crash-recovery and Article 9 runtime
      # contract suites described in 系統開發需求書 §61.
      - name: Test
        run: cargo test --workspace --locked

  constitution:
    name: Constitution gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI
        run: cargo build -p pearl-cli --locked

      # 系統開發需求書 §56: a violation must fail CI, otherwise the Constitution is
      # just a Markdown slogan. The CLI exits 2 on any violation.
      - name: Check capability manifests against the twelve articles
        run: ./target/debug/pearl constitution check capabilities/

      # The gate has to be able to fail, not merely be able to pass. This plants a
      # deliberately non-compliant manifest and asserts it is rejected with exit 2,
      # so a gate that silently stopped checking anything would break the build.
      - name: Verify the gate rejects a known violation
        run: |
          mkdir -p /tmp/gate-selftest
          cat > /tmp/gate-selftest/violation.yaml <<'EOF'
          id: selftest.deterministic-agent
          version: 1
          type: script
          description: Declares determinism but routes to a model. Violates Article 1.
          execution:
            kind: agent
            runtime: claude_code
          quality:
            deterministic: true
          risk:
            side_effect: true
          platform:
            windows: true
            linux: true
          EOF
          set +e
          ./target/debug/pearl constitution check /tmp/gate-selftest
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::Constitution gate returned $code, expected 2. The gate is not enforcing."
            exit 1
          fi
          echo "Gate correctly rejected the violation with exit 2."

  # Article 12: significant changes require an Architecture Decision Record.
  adr-enforcement:
    name: Article 12 ADR enforcement
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ADR requirement for API/schema/constitution changes
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          # Check if any changed file matches the trigger patterns.
          NEEDS_ADR=false
          for f in $CHANGED; do
            case "$f" in
              crates/*/src/lib.rs) NEEDS_ADR=true; break ;;
              schemas/*) NEEDS_ADR=true; break ;;
              CONSTITUTION.md) NEEDS_ADR=true; break ;;
            esac
          done

          if [ "$NEEDS_ADR" = "false" ]; then
            echo "No API/schema/constitution changes detected. ADR not required."
            exit 0
          fi

          # Check if an ADR was added or modified in this PR.
          ADR_PRESENT=false
          for f in $CHANGED; do
            case "$f" in
              docs/adr/ADR-*.md) ADR_PRESENT=true; break ;;
            esac
          done

          if [ "$ADR_PRESENT" = "false" ]; then
            echo "::error::This PR modifies public API (crates/*/src/lib.rs), schemas/, or CONSTITUTION.md but does not include an ADR (docs/adr/ADR-*.md). Article 12 requires architectural decisions to be recorded."
            exit 1
          fi

          echo "ADR found. Article 12 satisfied."
