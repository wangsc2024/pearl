[workspace]
resolver = "2"
members = [
    "crates/pearl-core",
    "crates/pearl-events",
    "crates/pearl-state",
    "crates/pearl-lease",
    "crates/pearl-queue",
    "crates/pearl-process-supervisor",
    "crates/pearl-governance",
    "crates/pearl-precision",
    "crates/pearl-runtime",
    "crates/pearl-capabilities",
    "crates/pearl-guard",
    "crates/pearl-scheduler",
    "crates/pearl-router",
    "crates/pearl-planner",
    "crates/pearl-plan-compiler",
    "crates/pearl-assurance",
    "crates/pearl-executor",
    "crates/pearl-workflow",
    "crates/pearl-policy",
    "crates/pearl-evidence",
    "crates/pearl-daemon",
    "crates/pearl-worker",
    "apps/pearl-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/wangsc2024/pearl"

[workspace.dependencies]
# Internal
pearl-core = { path = "crates/pearl-core" }
pearl-events = { path = "crates/pearl-events" }
pearl-state = { path = "crates/pearl-state" }
pearl-lease = { path = "crates/pearl-lease" }
pearl-queue = { path = "crates/pearl-queue" }
pearl-process-supervisor = { path = "crates/pearl-process-supervisor" }
pearl-governance = { path = "crates/pearl-governance" }
pearl-precision = { path = "crates/pearl-precision" }
pearl-runtime = { path = "crates/pearl-runtime" }
pearl-capabilities = { path = "crates/pearl-capabilities" }
pearl-guard = { path = "crates/pearl-guard" }
pearl-scheduler = { path = "crates/pearl-scheduler" }
pearl-router = { path = "crates/pearl-router" }
pearl-planner = { path = "crates/pearl-planner" }
pearl-plan-compiler = { path = "crates/pearl-plan-compiler" }
pearl-assurance = { path = "crates/pearl-assurance" }
pearl-executor = { path = "crates/pearl-executor" }
pearl-workflow = { path = "crates/pearl-workflow" }
pearl-policy = { path = "crates/pearl-policy" }
pearl-evidence = { path = "crates/pearl-evidence" }
pearl-daemon = { path = "crates/pearl-daemon" }
pearl-worker = { path = "crates/pearl-worker" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Identity: UUIDv7 for time-sortable ledger ids (ADR-0001)
uuid = { version = "1.11", features = ["v7", "serde"] }

# Persistence: bundled SQLite so the kernel has no external service dependency
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }

# Hashing for config_hash (Article 10) and evidence digests (Article 4)
sha2 = "0.10"
hex = "0.4"

# JSON Schema validation, so "validated against its schema" is a machine fact rather than
# a claim (Articles 2, 8). Default features are off deliberately: they pull reqwest, and a
# verifier that fetches a remote schema would put the network inside a verification path.
jsonschema = { version = "0.49", default-features = false }

# Errors
thiserror = "2.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Unix process-group signalling for tree kill (Article 9)
nix = { version = "0.29", features = ["signal", "process"] }

# Windows job objects: the platform's only reliable whole-tree containment (Article 9)
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # CreateJobObjectW takes SECURITY_ATTRIBUTES, and windows-sys gates a function on
    # every feature its signature mentions.
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Test-only
tempfile = "3.13"

[profile.release]
opt-level = 3
lto = "thin"
