# A guard. Article 7 requires fail-closed: if this cannot reach its rules, it denies.
id: guard.dangerous-shell
version: 1
type: guard
description: Blocks destructive shell commands before execution.
kind: guard
execution:
  kind: script
  runtime: python
  entrypoint:
    script: dangerous_shell_guard.py
quality:
  deterministic: true
risk:
  side_effect: false
platform:
  windows: true
  linux: true
on_error: deny
timeout_seconds: 5
retry:
  # A guard verdict must not be retried into a different answer.
  max_attempts: 1
