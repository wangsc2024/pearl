# A side-effecting capability. Article 5 requires an idempotency key template so that
# runtime retry cannot send the same notification twice.
id: effect.notify
version: 1
type: tool
description: Sends a notification to a channel.
kind: effect
execution:
  kind: script
  runtime: python
  entrypoint:
    script: notify.py
quality:
  deterministic: false
risk:
  side_effect: true
  idempotency:
    key_template: "ntfy:{channel}:{date}"
platform:
  windows: true
  linux: true
timeout_seconds: 30
retry:
  # Retrying is safe only because the ledger deduplicates on the idempotency key first;
  # without that gate this would have to be max_attempts: 1.
  max_attempts: 3
