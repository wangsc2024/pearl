# P0 mechanical scoring. Article 1 forbids routing this to an agent: the formula is
# fully specified, so there is nothing for a model to decide.
id: script.task-score
version: 1
type: script
description: Computes a task priority score from a fixed weighted formula.
execution:
  kind: script
  runtime: rust
quality:
  deterministic: true
risk:
  side_effect: false
platform:
  windows: true
  linux: true
schemas:
  output: verification-result-v1
timeout_seconds: 10
