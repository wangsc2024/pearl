# Capability manifests for the System Audit workflow

---
id: script.manifest-validator
version: 1
type: script
description: Validates all capability manifests against Constitution rules.
execution:
  kind: script
  runtime: rust
quality:
  deterministic: true
risk:
  side_effect: false
platform:
  windows: true
  linux: true
timeout_seconds: 60

---
id: script.constitution-gate
version: 1
type: script
description: Runs Constitution CI gate checks on the codebase.
execution:
  kind: script
  runtime: rust
quality:
  deterministic: true
risk:
  side_effect: false
platform:
  windows: true
  linux: true
timeout_seconds: 30

---
id: script.audit-facts
version: 1
type: script
kind: diagnostic
description: Collects the mechanically checkable facts a system audit rests on.
execution:
  kind: script
  runtime: python
  entrypoint:
    script: ../scripts/audit_facts.py
quality:
  # §65 splits the audit: counts, coverage and freshness are arithmetic and belong here;
  # interpreting them is the agent's part, in a separate capability.
  deterministic: true
risk:
  side_effect: false
platform:
  windows: true
  linux: true
timeout_seconds: 120

# NOT IMPLEMENTED. No entrypoint, so the registry says so rather than implying a script.
---
id: script.health-probe
version: 1
type: script
kind: diagnostic
description: Probes host health metrics. NOT IMPLEMENTED -- no entrypoint yet.
execution:
  kind: script
  runtime: python
quality:
  deterministic: false
risk:
  side_effect: false
platform:
  windows: true
  linux: true
timeout_seconds: 30

---
id: script.audit-report
version: 1
type: script
description: Compiles a structured audit report from check results.
execution:
  kind: script
  runtime: rust
quality:
  deterministic: true
risk:
  side_effect: false
platform:
  windows: true
  linux: true
timeout_seconds: 30

---
id: verifier.audit-report-schema
version: 1
type: verifier
description: Validates audit report against audit-report-v1 schema.
execution:
  kind: script
  runtime: python
quality:
  deterministic: true
risk:
  side_effect: false
platform:
  windows: true
  linux: true
schemas:
  input: audit-report-v1
  output: verification-result-v1
timeout_seconds: 10
